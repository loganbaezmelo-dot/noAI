<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>noAI Detector</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
    }

    p.subtitle {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      color: #fff;
      font-size: 0.95rem;
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .results {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 1.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .meter-container {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .meter-bar {
      height: 16px;
      background: #0b1120;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: #eab308;
      transition: width 0.6s ease, background-color 0.6s ease;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
    }

    .metric-card {
      background: #0b1120;
      padding: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .metric-title {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-val {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .highlight-block {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .hl-safe {
      background: rgba(34, 197, 94, 0.15);
      border-bottom: 2px solid #22c55e;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .hl-mid {
      background: rgba(234, 179, 8, 0.15);
      border-bottom: 2px solid #eab308;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .hl-danger {
      background: rgba(239, 68, 68, 0.2);
      border-bottom: 2px solid #ef4444;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .legend {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>noAI Detector</h1>
    <p class="subtitle">Structural cadence, per-sentence uniformity, and burstiness analysis</p>
  </header>

  <div class="card">
    <textarea id="inputText" placeholder="Paste text here to inspect per-sentence rhythm..."></textarea>

    <div class="btn-row">
      <button onclick="runAnalysis()">Analyze Sentences</button>
    </div>

    <div class="results" id="resultsBox">
      <div class="meter-container">
        <div style="display:flex; justify-content:space-between;">
          <strong id="probLabel">Likelihood of AI Generation</strong>
          <strong id="probScore">0%</strong>
        </div>
        <div class="meter-bar">
          <div class="meter-fill" id="meterFill"></div>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Burstiness (Length StdDev)</div>
          <div class="metric-val" id="valBurstiness">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Sentence Count</div>
          <div class="metric-val" id="valSentences">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Mean Sentence Length</div>
          <div class="metric-val" id="valMeanLen">0</div>
        </div>
      </div>

      <div>
        <strong style="font-size:0.9rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;">Sentence Breakdown</strong>
        <div class="highlight-block" id="highlightBlock" style="margin-top: 0.5rem;"></div>
        <div class="legend">
          <div class="legend-item"><span class="legend-dot" style="background:#ef4444;"></span> Uniform / Rigid</div>
          <div class="legend-item"><span class="legend-dot" style="background:#eab308;"></span> Neutral Cadence</div>
          <div class="legend-item"><span class="legend-dot" style="background:#22c55e;"></span> Natural / Irregular</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function splitSentencesProperly(text) {
    // Native browser sentence segmentation (protects decimals like 0.00 and abbreviations)
    if (window.Intl && Intl.Segmenter) {
      const segmenter = new Intl.Segmenter('en', { granularity: 'sentence' });
      return Array.from(segmenter.segment(text))
        .map(s => s.segment.trim())
        .filter(s => s.length > 0);
    }
    // Fallback: negative lookbehind/lookahead for numbers to prevent cutting 0.00
    return text.split(/(?<!\d)\.(?!\d)\s+|(?<=[?!])\s+|\n+/).map(s => s.trim()).filter(Boolean);
  }

  function runAnalysis() {
    const raw = document.getElementById('inputText').value.trim();
    if (!raw) return;

    const rawSentences = splitSentencesProperly(raw);
    const sentenceData = rawSentences.map(sentence => {
      const words = sentence.toLowerCase().match(/\b[a-z0-9']+\b/g) || [];
      return {
        text: sentence,
        wordCount: words.length
      };
    }).filter(s => s.wordCount > 0);

    const totalWords = sentenceData.reduce((acc, s) => acc + s.wordCount, 0);

    if (totalWords < 10) {
      alert("Please enter at least 10 words 💀");
      return;
    }

    const n = sentenceData.length;
    const meanLen = totalWords / n;

    // Corrected Variance calculation
    let burstiness = 0;
    if (n > 1) {
      const variance = sentenceData.reduce((sum, s) => sum + Math.pow(s.wordCount - meanLen, 2), 0) / n;
      burstiness = Math.sqrt(variance);
    } else {
      burstiness = 1.0;
    }

    // Balanced heuristic scoring
    // Rather than letting high burstiness drop the score straight to 0,
    // we evaluate if the sentences are standard AI-cadence (12-22 words each)
    let uniformSentences = 0;
    sentenceData.forEach(s => {
      if (s.wordCount >= 10 && s.wordCount <= 24) {
        uniformSentences++;
      }
    });
    const uniformityRatio = uniformSentences / n;

    let aiScore = 40;

    // Monotony penalty
    if (burstiness < 4.0) {
      aiScore += 30;
    } else if (burstiness < 7.0) {
      aiScore += 15;
    } else {
      aiScore -= 10;
    }

    // High proportion of typical AI length sentences
    if (uniformityRatio > 0.65) {
      aiScore += 25;
    }

    // Check for single run-on without punctuation
    if (n === 1 && totalWords > 18) {
      aiScore = 15;
    }

    aiScore = Math.max(5, Math.min(98, Math.round(aiScore)));

    // Highlight sentences based on structural rigidity
    const highlightedHTML = sentenceData.map(s => {
      const diff = Math.abs(s.wordCount - meanLen);
      let hlClass = 'hl-mid';

      if (diff < 3.5 && s.wordCount >= 8 && s.wordCount <= 25) {
        hlClass = 'hl-danger';
      } else if (diff > 8 || s.wordCount < 6 || s.wordCount > 35) {
        hlClass = 'hl-safe';
      }

      return `<span class="${hlClass}" title="Words: ${s.wordCount}">${s.text}</span>`;
    }).join(' ');

    // Update UI
    const resultsBox = document.getElementById('resultsBox');
    const meterFill = document.getElementById('meterFill');
    const probScore = document.getElementById('probScore');
    const valBurstiness = document.getElementById('valBurstiness');
    const valSentences = document.getElementById('valSentences');
    const valMeanLen = document.getElementById('valMeanLen');
    const highlightBlock = document.getElementById('highlightBlock');

    resultsBox.style.display = 'flex';
    probScore.textContent = aiScore + '%';
    meterFill.style.width = aiScore + '%';

    valBurstiness.textContent = burstiness.toFixed(2);
    valSentences.textContent = n;
    valMeanLen.textContent = meanLen.toFixed(1) + ' words';
    highlightBlock.innerHTML = highlightedHTML;

    if (aiScore >= 65) {
      meterFill.style.backgroundColor = '#ef4444';
    } else if (aiScore <= 35) {
      meterFill.style.backgroundColor = '#22c55e';
    } else {
      meterFill.style.backgroundColor = '#eab308';
    }
  }
</script>

</body>
</html>
