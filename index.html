<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>noAI Detector</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
    }

    p.subtitle {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      color: #fff;
      font-size: 0.95rem;
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .results {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 1.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .meter-container {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .meter-bar {
      height: 16px;
      background: #0b1120;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: #eab308;
      transition: width 0.6s ease, background-color 0.6s ease;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
    }

    .metric-card {
      background: #0b1120;
      padding: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .metric-title {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-val {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .verdict {
      padding: 0.85rem 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>noAI Detector</h1>
    <p class="subtitle">Statistical heuristic analysis: Burstiness, Perplexity approximation, and Lexical Diversity</p>
  </header>

  <div class="card">
    <textarea id="inputText" placeholder="Paste text here to analyze patterns..."></textarea>

    <div class="btn-row">
      <button onclick="runAnalysis()">Analyze Patterns</button>
    </div>

    <div class="results" id="resultsBox">
      <div class="meter-container">
        <div style="display:flex; justify-content:space-between;">
          <strong id="probLabel">Likelihood of AI Generation</strong>
          <strong id="probScore">0%</strong>
        </div>
        <div class="meter-bar">
          <div class="meter-fill" id="meterFill"></div>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Burstiness (Sentence StdDev)</div>
          <div class="metric-val" id="valBurstiness">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Lexical Diversity (TTR)</div>
          <div class="metric-val" id="valTTR">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Bigram Repetition Rate</div>
          <div class="metric-val" id="valBigrams">0</div>
        </div>
      </div>

      <div class="verdict" id="verdictBox"></div>
    </div>
  </div>
</div>

<script>
  const AI_BUZZWORDS = [
    "delve", "tapestry", "testament", "furthermore", "moreover",
    "intricate", "paramount", "in conclusion", "crucial", "landscape",
    "leverage", "foster", "holistic", "seamless", "comprehensive"
  ];

  function runAnalysis() {
    const raw = document.getElementById('inputText').value.trim();
    if (!raw) return;

    // Split sentences by punctuation OR line breaks
    const sentences = raw.split(/(?<=[.?!])\s+|\n+/).filter(s => s.trim().length > 0);
    const words = raw.toLowerCase().match(/\b[a-z0-9']+\b/g) || [];

    if (words.length < 15) {
      alert("Drop at least 15 words bro 💀");
      return;
    }

    // 1. Burstiness (StdDev of sentence word counts)
    const sentenceLengths = sentences.map(s => (s.match(/\b[a-z0-9']+\b/g) || []).length);
    let burstiness = 0;
    
    if (sentenceLengths.length > 1) {
      const avgLen = sentenceLengths.reduce((a, b) => a + b, 0) / sentenceLengths.length;
      const variance = sentenceLengths.reduce((sum, len) => sum + Math.pow(len - avgLen, 2), 0) / sentenceLengths.length;
      burstiness = Math.sqrt(variance);
    } else {
      // Single run-on fix: don't let 0 variance fake a machine score if it's unhinged autocomplete
      burstiness = sentenceLengths[0] > 20 ? 8.5 : 2.0;
    }

    // 2. Lexical Diversity (TTR)
    const uniqueWords = new Set(words);
    const ttr = uniqueWords.size / words.length;

    // 3. Bigram Repetition
    const bigrams = [];
    for (let i = 0; i < words.length - 1; i++) {
      bigrams.push(words[i] + ' ' + words[i + 1]);
    }
    const uniqueBigrams = new Set(bigrams);
    const bigramRepetition = 1 - (uniqueBigrams.size / (bigrams.length || 1));

    // 4. LLM Vocabulary Footprint
    let buzzwordHits = 0;
    AI_BUZZWORDS.forEach(bw => {
      if (raw.toLowerCase().includes(bw)) buzzwordHits++;
    });

    // Scoring Engine
    let aiScore = 50;

    // Burstiness factor
    if (burstiness < 3.5) aiScore += 25;
    else if (burstiness > 9.0) aiScore -= 15;

    // TTR factor (LLMs sit in the 0.50 - 0.72 pocket)
    if (ttr >= 0.52 && ttr <= 0.72) aiScore += 15;
    else if (ttr > 0.85) aiScore -= 10;

    // Repeated phrasing penalty
    if (bigramRepetition < 0.04) aiScore += 10;

    // Buzzword penalty
    aiScore += (buzzwordHits * 12);

    // AI meta-analysis catch: catches AI explaining AI logic
    if (raw.toLowerCase().includes("burstiness") || raw.toLowerCase().includes("standard deviation") || raw.toLowerCase().includes("variance")) {
      aiScore += 35;
    }

    // Clamp score
    aiScore = Math.max(5, Math.min(99, Math.round(aiScore)));

    // Render results
    const resultsBox = document.getElementById('resultsBox');
    const meterFill = document.getElementById('meterFill');
    const probScore = document.getElementById('probScore');
    const valBurstiness = document.getElementById('valBurstiness');
    const valTTR = document.getElementById('valTTR');
    const valBigrams = document.getElementById('valBigrams');
    const verdictBox = document.getElementById('verdictBox');

    resultsBox.style.display = 'flex';
    probScore.textContent = aiScore + '%';
    meterFill.style.width = aiScore + '%';

    valBurstiness.textContent = burstiness.toFixed(2);
    valTTR.textContent = (ttr * 100).toFixed(1) + '%';
    valBigrams.textContent = (bigramRepetition * 100).toFixed(1) + '%';

    if (aiScore >= 65) {
      meterFill.style.backgroundColor = '#ef4444';
      verdictBox.style.background = 'rgba(239, 68, 68, 0.1)';
      verdictBox.style.border = '1px solid #ef4444';
      verdictBox.innerHTML = `<strong>Caught in 4K 💀:</strong> High probability of AI generation. Algorithmic syntax or statistical buzzwords detected.`;
    } else if (aiScore <= 35) {
      meterFill.style.backgroundColor = '#22c55e';
      verdictBox.style.background = 'rgba(34, 197, 94, 0.1)';
      verdictBox.style.border = '1px solid #22c55e';
      verdictBox.innerHTML = `<strong>Human Verified:</strong> Natural structural irregularity and erratic phrasing detected.`;
    } else {
      meterFill.style.backgroundColor = '#eab308';
      verdictBox.style.background = 'rgba(234, 179, 8, 0.1)';
      verdictBox.style.border = '1px solid #eab308';
      verdictBox.innerHTML = `<strong>Mixed Signals:</strong> Text contains conflicting structural traits.`;
    }
  }
</script>

</body>
</html>
