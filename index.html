<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>noAI Detector v4.4</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h1 { margin: 0; font-size: 1.75rem; }
    p.subtitle { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.95rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      color: #fff;
      font-size: 0.95rem;
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
    }

    textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }

    .btn-row { display: flex; gap: 0.75rem; margin-top: 1rem; }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover { background: #1d4ed8; }

    .results {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 1.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .meter-container { display: flex; flex-direction: column; gap: 0.4rem; }
    .meter-bar {
      height: 16px;
      background: #0b1120;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.6s ease, background-color 0.6s ease;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
    }

    .metric-card {
      background: #0b1120;
      padding: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .metric-title {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-val {
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .highlight-block {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem;
      line-height: 1.9;
      font-size: 0.95rem;
    }

    /* Cohesive, subtle highlighting instead of rainbow mess */
    .hl-safe {
      border-bottom: 2px solid rgba(34, 197, 94, 0.4);
      padding: 1px 2px;
    }

    .hl-danger {
      background: rgba(239, 68, 68, 0.22);
      border-bottom: 2px solid #ef4444;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .warning-banner {
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid #eab308;
      color: #facc15;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>noAI Detector v4.4</h1>
    <p class="subtitle">Human-Calibrated Baseline & Subtle Visual Highlighting</p>
  </header>

  <div class="card">
    <textarea id="inputText" placeholder="Paste your text here..."></textarea>

    <div class="btn-row">
      <button onclick="runAnalysis()">Analyze Patterns</button>
    </div>

    <div class="results" id="resultsBox">
      <div id="sampleWarning" class="warning-banner"></div>

      <div class="meter-container">
        <div style="display:flex; justify-content:space-between;">
          <strong id="probLabel">Likelihood of AI Generation</strong>
          <strong id="probScore">0%</strong>
        </div>
        <div class="meter-bar">
          <div class="meter-fill" id="meterFill"></div>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Burstiness (StdDev)</div>
          <div class="metric-val" id="valBurstiness">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Character Entropy</div>
          <div class="metric-val" id="valEntropy">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Formal Punctuation</div>
          <div class="metric-val" id="valPunct">0%</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Emoji Contribution</div>
          <div class="metric-val" id="valEmojiDiscount">0%</div>
        </div>
      </div>

      <div>
        <strong style="font-size:0.9rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;">Sentence Flow</strong>
        <div class="highlight-block" id="highlightBlock" style="margin-top: 0.5rem;"></div>
      </div>
    </div>
  </div>
</div>

<script>
  function splitSentencesProperly(text) {
    let clean = text.replace(/(\d+)\.(\d+)/g, '$1<DEC>$2');
    clean = clean
      .replace(/^[\s*>-]+/gm, '')
      .replace(/[*_~`"\[\]]/g, '')
      .replace(/:\s+/g, '. ');

    const rawSegments = clean.split(/(?<=[.?!])\s+|\n+/);

    return rawSegments
      .map(s => s.replace(/<DEC>/g, '.').trim())
      .filter(s => (s.match(/\b[a-zA-Z0-9']+\b/g) || []).length >= 2);
  }

  function calculateEntropy(str) {
    const cleanStr = str
      .replace(/\p{Extended_Pictographic}/gu, '')
      .replace(/[*_~`#>-]/g, '')
      .trim()
      .toLowerCase();

    const len = cleanStr.length;
    if (len === 0) return 0;
    const frequencies = {};
    for (const char of cleanStr) {
      frequencies[char] = (frequencies[char] || 0) + 1;
    }
    return Object.values(frequencies).reduce((sum, count) => {
      const p = count / len;
      return sum - p * Math.log2(p);
    }, 0);
  }

  function runAnalysis() {
    const raw = document.getElementById('inputText').value.trim();
    if (!raw) return;

    const sentenceData = splitSentencesProperly(raw).map(sentence => {
      const words = sentence.toLowerCase().match(/\b[a-z0-9']+\b/g) || [];
      return { text: sentence, wordCount: words.length };
    }).filter(s => s.wordCount > 0);

    const totalWords = sentenceData.reduce((acc, s) => acc + s.wordCount, 0);
    const sentenceCount = sentenceData.length;

    if (totalWords < 5) {
      alert("Please enter at least 5 words 💀");
      return;
    }

    const warningBox = document.getElementById('sampleWarning');
    if (totalWords < 25 || sentenceCount < 2) {
      warningBox.style.display = 'block';
      warningBox.textContent = `⚠️ Small sample size (${totalWords} words). Statistical confidence is limited.`;
    } else {
      warningBox.style.display = 'none';
    }

    // 1. Burstiness
    const meanLen = totalWords / (sentenceCount || 1);
    let burstiness = 0;
    if (sentenceCount >= 2) {
      const variance = sentenceData.reduce((sum, s) => sum + Math.pow(s.wordCount - meanLen, 2), 0) / sentenceCount;
      burstiness = Math.sqrt(variance);
    } else {
      burstiness = 6.0;
    }

    // 2. Character Entropy
    const entropy = calculateEntropy(raw);

    // 3. Punctuation
    const formalPunctuationMatches = raw.match(/[,;:\u2014\u2013\(\)]/g) || [];
    const formalPunctRatio = (formalPunctuationMatches.length / (totalWords || 1));

    // 4. Emoji Discount
    const emojiMatches = raw.match(/\p{Extended_Pictographic}/gu) || [];
    const emojiCount = emojiMatches.length;
    let emojiDiscount = 0;
    if (emojiCount > 0) {
      emojiDiscount = Math.min(6, Math.max(1, Math.round((emojiCount / Math.max(1, totalWords / 20)) * 2)));
    }

    // --- Calibrated Human-First Engine ---
    // Start low: real humans should land between 5% and 18%
    let score = 18;

    // AI Penalty Vectors
    if (entropy >= 4.18 && entropy <= 4.55) {
      if (burstiness < 5.0) {
        score += 42; // Hallmark LLM: uniform sentences + expected character distribution
      } else if (burstiness < 8.0) {
        score += 26; // Moderate burstiness with AI entropy
      } else {
        score += 12; // High burstiness cushions entropy penalty
      }
    } else if (entropy < 3.85 || entropy > 4.70) {
      score -= 10;
    }

    // Burstiness Scoring
    if (sentenceCount >= 3) {
      if (burstiness < 3.5) score += 28;       // Highly robotic uniformity
      else if (burstiness > 8.0) score -= 12;  // High human pacing variance
    }

    // Formal Punctuation
    if (formalPunctRatio > 0.10 && burstiness < 6.5) score += 14;

    // Apply bounded emoji discount
    score -= emojiDiscount;

    // Sample size dampening anchored to 18% (innocent human baseline)
    const sampleWeight = Math.min(1.0, totalWords / 35);
    let finalScore = Math.round(18 + (score - 18) * sampleWeight);
    finalScore = Math.max(3, Math.min(98, finalScore));

    // Cleaned Highlights: Only flag genuinely rigid, robotic sentences in red
    const highlightedHTML = sentenceData.map(s => {
      const diff = Math.abs(s.wordCount - meanLen);
      let hlClass = 'hl-safe';
      // Only mark danger if text has >=3 sentences and length is unnervingly close to average
      if (sentenceCount >= 3 && diff < 2.2 && s.wordCount >= 10 && s.wordCount <= 22 && burstiness < 5.5) {
        hlClass = 'hl-danger';
      }
      return `<span class="${hlClass}">${s.text}</span>`;
    }).join(' ');

    // Update UI
    document.getElementById('resultsBox').style.display = 'flex';
    document.getElementById('probScore').textContent = finalScore + '%';

    const meterFill = document.getElementById('meterFill');
    meterFill.style.width = finalScore + '%';

    document.getElementById('valBurstiness').textContent = burstiness.toFixed(2);
    document.getElementById('valEntropy').textContent = entropy.toFixed(2);
    document.getElementById('valPunct').textContent = (formalPunctRatio * 100).toFixed(1) + '%';
    document.getElementById('valEmojiDiscount').textContent = `-${emojiDiscount}%`;
    document.getElementById('highlightBlock').innerHTML = highlightedHTML;

    if (finalScore >= 60) meterFill.style.backgroundColor = '#ef4444';
    else if (finalScore <= 30) meterFill.style.backgroundColor = '#22c55e';
    else meterFill.style.backgroundColor = '#eab308';
  }
</script>

</body>
</html>
